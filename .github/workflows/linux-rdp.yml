name: Ubuntu RDP Server

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: 1. Install Desktop Environment and RDP Server
        run: |
          sudo apt update
          # نصب محیط دسکتاپ XFCE
          sudo apt install -y xfce4 xfce4-goodies
          # نصب سرویس‌دهنده RDP
          sudo apt install -y xrdp
          # تنظیم XFCE به عنوان نشست پیش‌فرض برای xRDP
          echo xfce4-session > ~/.xsession
          sudo systemctl restart xrdp

      - name: 2. Create Admin User
        run: |
          # ایجاد کاربر ادمین با رمز مشخص (قابل تغییر)
          sudo useradd -m -s /bin/bash CynetAdmin
          echo "CynetAdmin:Cynet@2026" | sudo chpasswd
          # اضافه کردن کاربر به گروه sudo
          sudo usermod -aG sudo CynetAdmin

      - name: 3. Install and Connect Tailscale
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          # نصب Tailscale
          curl -fsSL https://tailscale.com/install.sh | sh
          # اتصال به شبکه Tailscale
          sudo tailscale up --authkey="$TAILSCALE_AUTHKEY" --hostname="github-ubuntu-rdp"

      - name: 4. Show Connection Info
        run: |
          # دریافت IP اختصاصی Tailscale
          TS_IP=$(tailscale ip -4)
          echo "=================================================="
          echo "  >>> RDP SERVER IS READY! <<<"
          echo "  Tailscale IP : $TS_IP"
          echo "  Username     : CynetAdmin"
          echo "  Password     : Cynet@2026"
          echo "  >> Use any RDP client to connect to: $TS_IP"
          echo "=================================================="

      - name: 5. Keep Server Alive (6 Hours)
        run: |
          for i in {1..360}; do
            sleep 60
            echo "[$i/360] Server running..."
          done
