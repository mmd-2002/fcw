name: Ubuntu SSH Server (Tailscale)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      # ==========================================
      # کش کردن پکیج‌های APT (اختیاری ولی سریعتر)
      # ==========================================
      - name: Cache APT Packages
        uses: actions/cache@v3
        id: cache-apt
        with:
          path: /var/cache/apt/archives
          key: ubuntu-apt-cache-ssh-${{ runner.os }}

      # ==========================================
      # نصب SSH Server
      # ==========================================
      - name: Install SSH Server
        run: |
          sudo apt update
          sudo apt install -y openssh-server
          sudo systemctl enable ssh
          sudo systemctl start ssh

      # ==========================================
      # ایجاد کاربر با رمز عبور
      # ==========================================
      - name: Create Admin User
        run: |
          sudo useradd -m -s /bin/bash CynetAdmin
          echo "CynetAdmin:Cynet@2026" | sudo chpasswd
          sudo usermod -aG sudo CynetAdmin

      # ==========================================
      # تنظیم فایروال (اختیاری)
      # ==========================================
      - name: Configure Firewall (Allow SSH)
        run: |
          sudo ufw allow 22/tcp
          sudo ufw --force enable

      # ==========================================
      # نصب و اتصال Tailscale
      # ==========================================
      - name: Install Tailscale and Connect
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh
          sudo tailscale up --authkey="$TAILSCALE_AUTHKEY" --hostname="github-ubuntu-ssh" --ssh

      # ==========================================
      # نمایش اطلاعات اتصال
      # ==========================================
      - name: Show Connection Info
        run: |
          TS_IP=$(tailscale ip -4)
          echo "=================================================="
          echo "  >>> SSH SERVER IS READY! <<<"
          echo "  Tailscale IP : $TS_IP"
          echo "  Username     : CynetAdmin"
          echo "  Password     : Cynet@2026"
          echo "  >> Connect via:"
          echo "     tailscale ssh CynetAdmin@$TS_IP"
          echo "  or"
          echo "     ssh CynetAdmin@$TS_IP"
          echo "=================================================="

      # ==========================================
      # زنده نگه داشتن سرور (۶ ساعت)
      # ==========================================
      - name: Keep Server Alive
        run: |
          for i in {1..360}; do
            sleep 60
            echo "[$i/360] Server running..."
          done
