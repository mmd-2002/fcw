name: Windows Cloud RDP

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: 1. Enable Remote Desktop & Firewall
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -name "fDenyTSConnections" -Value 0
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -name "UserAuthentication" -Value 0
          
          # این قانون کمکی برای باز کردن پورت روی سابنت تیلاسکیل
          New-NetFirewallRule -DisplayName "Allow RDP Tailscale" -Direction Inbound -Protocol TCP -LocalPort 3389 -Action Allow -RemoteAddress 100.64.0.0/10

      - name: 2. Create Admin Account
        run: |
          $Password = ConvertTo-SecureString "Cynet@2026" -AsPlainText -Force
          New-LocalUser -Name "CynetAdmin" -Password $Password -PasswordNeverExpires -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Administrators" -Member "CynetAdmin" -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "CynetAdmin" -ErrorAction SilentlyContinue
          net user runneradmin Cynet@2026

      - name: 3. Install & Connect Tailscale VPN (HARD FIREWALL OFF)
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          # دانلود و نصب تیلاسکیل
          Invoke-WebRequest "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi" -OutFile "C:\tailscale.msi"
          Start-Process msiexec -ArgumentList "/i C:\tailscale.msi /quiet /norestart" -Wait
          
          Start-Sleep -Seconds 5
          & "C:\Program Files\Tailscale\tailscale.exe" up --authkey="$Env:TAILSCALE_AUTHKEY" --hostname="github-rdp-server"
          
          Start-Sleep -Seconds 8
          Write-Host "Restarting Remote Desktop Service..." -ForegroundColor Cyan
          Restart-Service TermService -Force
          Start-Sleep -Seconds 5

          # ============================================================
          # روش قطعی برای خاموش کردن کامل فایروال (با دستور قدیمی netsh)
          # ============================================================
          Write-Host "Disabling Windows Firewall via netsh..." -ForegroundColor Yellow
          netsh advfirewall set allprofiles state off
          # ============================================================

          Write-Host "Checking RDP listening ports:" -ForegroundColor Yellow
          netstat -an | findstr :3389
          
          Write-Host "Testing local RDP connection (127.0.0.1):" -ForegroundColor Yellow
          Test-NetConnection -ComputerName 127.0.0.1 -Port 3389

          $ts_ip = & "C:\Program Files\Tailscale\tailscale.exe" ip -4
          
          Write-Host ""
          Write-Host "==================================================" -ForegroundColor Green
          Write-Host "  >>> RDP SERVER IS READY! <<<" -ForegroundColor Cyan
          Write-Host "  Tailscale IP : $ts_ip" -ForegroundColor Yellow
          Write-Host "  Username     : CynetAdmin" -ForegroundColor Yellow
          Write-Host "  Password     : Cynet@2026" -ForegroundColor Yellow
          Write-Host "  >> Open mstsc and connect to: $ts_ip" -ForegroundColor Magenta
          Write-Host "==================================================" -ForegroundColor Green

      - name: 4. Keep Server Alive (6 Hours)
        run: |
          for ($i = 1; $i -le 360; $i++) {
            Start-Sleep -Seconds 60
            Write-Host "[$i/360] Server running..."
          }
